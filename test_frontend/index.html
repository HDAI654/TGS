<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="WORLDTV — discover live television from around the world.">
  <title>WORLDTV — One planet. Every signal.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar" aria-label="Primary navigation">
      <button id="brandToggle" class="brand" type="button" aria-label="Toggle sidebar">
        <span class="brand-mark"><i class="bi bi-broadcast-pin"></i></span>
        <span class="brand-name">TGS<span>TV</span></span>
      </button>

      <div class="sidebar-search">
        <form id="searchForm" role="search">
          <i class="bi bi-search"></i>
          <input id="searchInput" type="search" placeholder="Search channels…" autocomplete="off">
          <kbd>⌘K</kbd>
          <button type="submit" aria-label="Search"><i class="bi bi-arrow-return-left"></i></button>
        </form>
      </div>

      <nav class="nav">
        <div class="nav-label">Browse</div>
        <button class="nav-item" data-action="countries"><i class="bi bi-flag"></i><span>Countries</span></button>
        <button class="nav-item" data-action="saved"><i class="bi bi-bookmark"></i><span>Saved</span><span id="savedCount" class="count">0</span></button>
        <div class="nav-label category-label">Categories</div>
        <div id="categoryList"></div>
      </nav>

      <div class="sidebar-footer">
        <button class="nav-item" data-action="theme"><i id="themeIcon" class="bi bi-sun"></i><span>Theme</span></button>
        <div class="api-status"><span id="apiDot"></span><span id="apiStatus">API disconnected</span></div>
      </div>
    </aside>

    <div id="mobileBackdrop" class="mobile-backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button id="hamburger" class="icon-btn mobile-only" type="button" aria-label="Open navigation" aria-controls="sidebar">
          <i class="bi bi-list"></i>
        </button>
        <div class="topbar-context">
          <span class="eyebrow"><span class="live-dot"></span> LIVE DIRECTORY</span>
        </div>
        <div class="topbar-actions">
          <button class="icon-btn" data-action="countries" aria-label="Browse countries"><i class="bi bi-flag"></i></button>
          <button class="icon-btn" data-action="saved" aria-label="Saved channels"><i class="bi bi-bookmark"></i></button>
          <button class="icon-btn" data-action="theme" aria-label="Toggle theme"><i class="bi bi-sun"></i></button>
        </div>
      </header>

      <section class="hero">
        <div class="hero-copy">
          <span class="hero-kicker">GLOBAL SIGNAL BROWSER</span>
          <h1>TGS TV</h1>
          <h1>One planet.<br><em>Every signal.</em></h1>
          <p>Discover live television by country, category, or channel name.</p>
        </div>

        <div class="earth-wrap" aria-hidden="true">
          <div class="orbit orbit-a"></div>
          <div class="orbit orbit-b"></div>
          <div class="earth-stage" aria-hidden="true">
  <div class="earth-orbit orbit-main"></div>
  <div class="earth-orbit orbit-cross"></div>
  <div class="earth-orbit orbit-faint"></div>

  <div class="earth">
    <div class="earth-glow"></div>

    <div class="earth-disc">
      <div class="earth-land"></div>
      <div class="earth-ocean-shine"></div>
      <div class="earth-clouds cloud-a"></div>
      <div class="earth-clouds cloud-b"></div>
      <div class="earth-grid"></div>

      <div class="earth-night">
        <span class="city c1"></span><span class="city c2"></span>
        <span class="city c3"></span><span class="city c4"></span>
        <span class="city c5"></span><span class="city c6"></span>
        <span class="city c7"></span><span class="city c8"></span>
        <span class="city c9"></span><span class="city c10"></span>
        <span class="city c11"></span><span class="city c12"></span>
      </div>

      <div class="earth-terminator"></div>
      <div class="earth-specular"></div>
      <div class="earth-rim"></div>

      <div class="signal s1"></div><div class="signal s2"></div>
      <div class="signal s3"></div><div class="signal s4"></div>
      <div class="signal s5"></div><div class="signal s6"></div>
    </div>
  </div>

  <div class="satellite satellite-a"><i></i><b></b></div>
  <div class="satellite satellite-b"><i></i><b></b></div>
  <div class="data-pulse p1"></div>
  <div class="data-pulse p2"></div>
  <div class="data-pulse p3"></div>
</div>
        </div>
      </section>

      <section class="stats" aria-label="Directory statistics">
        <div><strong id="statChannels">—</strong><span>Channels</span></div>
        <div><strong id="statCountries">—</strong><span>Countries</span></div>
        <div><strong id="statCategories">28</strong><span>Categories</span></div>
      </section>

    </main>
  </div>

  <div id="discoveryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="discoveryTitle" hidden>
    <div class="modal-backdrop" data-close="discovery"></div>
    <section class="modal-panel discovery-panel">
      <header class="modal-header">
        <div><span class="eyebrow">DISCOVERY</span><h2 id="discoveryTitle">Channels</h2><p id="discoveryMeta"></p></div>
        <button class="icon-btn" data-close="discovery" aria-label="Close"><i class="bi bi-x-lg"></i></button>
      </header>
      <div id="discoveryBody" class="discovery-body"></div>
      <footer id="pagination" class="pagination"></footer>
    </section>
  </div>

  <div id="playerModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="playerTitle" hidden>
    <div class="modal-backdrop" data-close="player"></div>
    <section class="modal-panel player-panel">
      <header class="modal-header compact">
        <span class="eyebrow">LIVE PLAYBACK</span>
        <button class="icon-btn" data-close="player" aria-label="Close player"><i class="bi bi-x-lg"></i></button>
      </header>
      <div class="video-frame">
        <video id="video" controls playsinline preload="metadata"></video>
        <div id="playerOverlay" class="player-overlay"><i class="bi bi-broadcast"></i><span>Select a source to begin</span></div>
      </div>
      <div class="player-info">
        <div class="player-title-row">
          <div><span class="live-badge">LIVE</span><h2 id="playerTitle">Channel</h2><p id="playerSubtitle"></p></div>
          <button id="favoriteBtn" class="favorite-btn" type="button"><i class="bi bi-bookmark"></i><span>Save</span></button>
        </div>
        <div id="playerMeta" class="metadata"></div>
        <div class="sources">
          <div class="source-heading"><span>STREAM SOURCES</span><small id="sourceCount"></small></div>
          <div id="sourceList"></div>
        </div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
