{% extends "admin/base.html" %}
{% block title %}TGS Administration{% endblock %}
{% block branding %}<a href="{% url 'admin:index' %}" style="font-weight:700;">TGS Administration</a>{% endblock %}
{% block extrastyle %}
{{ block.super }}
<style>
:root { --accent: #417690; }
.dashboard-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:18px; margin:20px 0; }
.monitor-card { background:#fff; border:1px solid #ddd; border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.05); }
.monitor-card h2 { margin-top:0; font-size:18px; }
.monitor-value { font-size:28px; font-weight:700; margin:8px 0; }
.monitor-ok { color:#2e7d32; } .monitor-bad { color:#b71c1c; }
.monitor-actions { display:flex; flex-wrap:wrap; gap:10px; margin:20px 0; }
.monitor-actions a { padding:10px 14px; border-radius:8px; background:var(--accent); color:white !important; text-decoration:none; }
.log-box { background:#111827; color:#e5e7eb; border-radius:10px; padding:16px; overflow:auto; max-height:600px; white-space:pre-wrap; font-family:monospace; }
@media (max-width:600px) { .monitor-card { padding:15px; } }
</style>
{% endblock %}
